# Builds the image after CI passed on main, then deploy-kit deploys it: the
# server pulls portfolio:<sha> and restarts (deploy-app, which rolls back by
# itself when the new container does not become healthy).
# The image holds only the build output (multi-stage Dockerfile).
name: Docker

on:
  # Build only after CI passed on main.
  workflow_run: # zizmor: ignore[dangerous-triggers] only same-repo pushes to main pass the `if` below
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-main
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/ali-moradi-design/portfolio:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    uses: ali-moradi-design/deploy-kit/.github/workflows/deploy-app.yml@ed4a1649d523120609b56471f232facb73e32fb0 # v1.0.0
    # the deploy job needs the environment's SSH secrets; deploy-kit is ours
    # and pinned to a SHA, so passing them on is safe
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      image-tag: ${{ needs.image.outputs.sha }}
      site-url: https://ali-moradi-develop.com
      smoke-paths: / /projects /ali-moradi-cv.pdf /projects/aml-dashboard.mp4
